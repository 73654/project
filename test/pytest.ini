[pytest]
addopts = -p no:warnings

# 日志配置
log_cli = true
log_cli_level = ERROR
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 为不同的日志记录器设置级别
log_level = ERROR
log_file_level = ERROR

# 特定模块的日志级别
log_file_format = %(asctime)s [%(name)s] %(levelname)s: %(message)s
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# 设置各个模块的日志级别
log_cli_handler_level = ERROR
logging_modules =
    allure:ERROR
    allure.listener:ERROR
    airtest:ERROR
    airtest.core.api:ERROR
    airtest.aircv:ERROR
    airtest.core.android:ERROR
    airtest.core.helper:ERROR
    urllib3:ERROR

markers =
    P0: 必测和高
    P1: 中
    P2: 低
    login: marks login cases as test
